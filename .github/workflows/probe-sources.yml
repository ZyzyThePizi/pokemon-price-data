name: Sealed images check (branch only)

# Temporary: runs the sealed-images step on this branch and commits its output here for review.
# Delete this file and scripts/probe-sources.mjs before anything merges.
on:
  push:
    branches: [claude/sharp-cannon-uml18w]
    paths: [scripts/build-sealed-images.mjs, scripts/lib/sealed-match.mjs, .github/workflows/probe-sources.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PriceCharting's set lists (probe)
        run: |
          mkdir -p probe
          for u in category/pokemon-cards "category/pokemon-cards?region=japan" brand/pokemon; do
            curl -sL -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/124.0" "https://www.pricecharting.com/$u" -o "probe/pc-$(echo $u | tr '/?=' '___').html"; sleep 2
          done
          ls -la probe
      - run: node scripts/build-sealed-images.mjs
        env:
          PC_PAGES: '3000'
      - name: Commit the output to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/v2/sealed-images.json catalog/v2/sealed-sources.json probe
          git commit -m "Sealed images check output" && git push

name: Probe picture sources (branch only)

# Temporary: dumps TCGplayer sealed lists and logo-source answers into probe/ on this branch.
# Delete this file and scripts/probe-sources.mjs before anything merges.
on:
  push:
    branches: [claude/sharp-cannon-uml18w]
    paths: [scripts/probe-sources.mjs, .github/workflows/probe-sources.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs
      - name: Commit the dump to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Probe dump" && git push

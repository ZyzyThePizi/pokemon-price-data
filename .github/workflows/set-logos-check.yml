name: Set logos check (branch only)

# Runs the set-logo step on this branch's catalog and keeps the result as an artifact. Commits nothing.
# Temporary: delete this file before the branch is merged.
on:
  push:
    branches: [claude/set-logos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fill set logos
        run: node scripts/build-ciac-catalog.mjs --logos-only
      - name: Every set's logo, one per line
        run: |
          node -e '
          const s = require("./catalog/v2/sets.json"), f = Object.fromEntries(s.fields.map((k, i) => [k, i]));
          const c = require("./catalog/v2/set-logos.json").sets;
          for (const r of s.rows) if (c[r[f.id]]) console.log([r[f.lang], r[f.id], r[f.nameEn] || r[f.name], c[r[f.id]].source || "none", r[f.logo] || (c[r[f.id]].tried || []).join(" ")].join(" | "))'
      - uses: actions/upload-artifact@v4
        with:
          name: set-logos
          path: |
            catalog/v2/set-logos.json
            catalog/v2/sets.json

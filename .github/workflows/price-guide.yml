name: Update price guide

on:
  schedule:
    # ~05:00 CET / 04:00 UTC (03:00 UTC during CEST) — after Cardmarket's own
    # daily price guide refresh. Cron is always UTC.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: price-guide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch, slim, and write price data
        run: node scripts/fetch-price-guide.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "price-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices history
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update price guide $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # This repo is a generated data cache, not source code — nothing here
      # needs git history, since every product's full history already lives
      # IN the current history/*.json shard files, not across old commits.
      # Squashing to a single orphan commit after every change keeps the
      # repo's .git size roughly constant forever instead of growing with
      # every daily commit (see ROADMAP.md 2.3's repo-growth math in the app
      # repo — this is that mitigation). scripts/, the workflow, and README
      # are preserved since they're re-added from the working tree, not
      # from history.
      - name: Squash history to keep the repo small
        if: steps.commit.outputs.changed == 'true'
        run: |
          git checkout --orphan _squash_tmp
          git add -A
          git commit -m "Price guide as of $(date -u +%Y-%m-%d)"
          git branch -D main
          git branch -m main
          git push --force origin main

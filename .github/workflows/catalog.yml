name: Update card catalog

on:
  schedule:
    # Daily, 06:30 UTC — after the 04:00 price job. Every step is incremental
    # (new or week-old sets, new cards only), so a quiet day costs minutes; a
    # new set is scannable the day its catalog lands (CIAC scanner plan C).
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-scrape every set'
        type: boolean
        default: false

# Same group as the price job on purpose: that job squashes history and
# force-pushes an orphan commit built from its own checkout, so the two must
# never run at the same time or one would drop the other's commit.
concurrency:
  group: price-guide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Image tools
        run: npm install --no-save sharp

      # Pokédex v2: forms and artwork (PokeAPI). Incremental: art only for new entries.
      - name: Refresh the Pokédex
        run: node scripts/build-pokedex.mjs

      - name: Refresh the Pokéllector catalog
        run: node scripts/fetch-catalog.mjs ${{ inputs.force && '--force' || '' }}

      # CIAC catalog v2 (TCGdex: rarity, illustrator, Cardmarket id per
      # variant). Incremental: only new/recent cards are fetched again.
      - name: Refresh the CIAC catalog (v2)
        run: node scripts/test-print-fixes.mjs && node scripts/build-ciac-catalog.mjs ${{ inputs.force && '--force' || '' }}

      # Pictures for sealed products (TCGplayer, then PriceCharting), paired by name with
      # Cardmarket's product list. Incremental: only stale TCGplayer groups / PriceCharting sets.
      - name: Sealed product pictures
        run: node scripts/test-sealed-match.mjs && node scripts/build-sealed-images.mjs

      # Fingerprints for the CIAC scanner (incremental: only new cards)
      - name: Update the scanner index
        run: node scripts/build-scan-index.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The neural scanner (scan/v3): new cards embedded with the shipped model and
      # appended as a small daily chunk, after a parity check (scripts/scan_daily.py).
      # A failed check writes nothing; the catalog is still committed, then the job fails.
      - name: Neural scanner index (new cards)
        id: neural
        continue-on-error: true
        run: |
          pip install --quiet numpy onnxruntime opencv-python-headless
          node scripts/scan-prep.mjs "$RUNNER_TEMP/scan"
          python scripts/scan_daily.py "$RUNNER_TEMP/scan"

      # No squash here: the next daily price run folds this commit into its
      # orphan snapshot.
      - name: Commit if changed
        run: |
          git config user.name "price-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog scan
          if git diff --staged --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update card catalog $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Fail if the neural index step failed
        if: steps.neural.outcome == 'failure'
        run: exit 1

name: Update card catalog

on:
  schedule:
    # Weekly, Monday 06:00 UTC — two hours after the daily price job. Sets
    # only change when a new expansion is listed, and the script itself only
    # re-scrapes new or week-old sets.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-scrape every set'
        type: boolean
        default: false

# Same group as the price job on purpose: that job squashes history and
# force-pushes an orphan commit built from its own checkout, so the two must
# never run at the same time or one would drop the other's commit.
concurrency:
  group: price-guide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh the Pokéllector catalog
        run: node scripts/fetch-catalog.mjs ${{ inputs.force && '--force' || '' }}

      # No squash here: the next daily price run folds this commit into its
      # orphan snapshot.
      - name: Commit if changed
        run: |
          git config user.name "price-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog
          if git diff --staged --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update card catalog $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
